[project]
name = "resume-agent"
version = "0.1.0"
description = "LLM-powered resume tailoring agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.28",          # Claude API
    "pdfplumber>=0.11",         # PDF text extraction
    "httpx>=0.27",              # Async-capable HTTP client
    "beautifulsoup4>=4.12",     # HTML parsing for JD extraction
    "pydantic>=2.7",            # Typed data models
    "pydantic-settings>=2.3",   # Settings from .env
    "weasyprint>=62",           # Markdown → HTML → PDF
    "markdown>=3.6",            # Markdown → HTML
    "rich>=13",                 # CLI pretty output
    "typer>=0.12",              # CLI framework
    "python-slugify>=8.0",      # URL → safe filename slug
]

[project.scripts]
resume-agent = "resume_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_agent"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",          # httpx mock for tests
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--cov=src/resume_agent --cov-report=term-missing"

[tool.ruff]
src        = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
mypy_path = "src"
strict = true