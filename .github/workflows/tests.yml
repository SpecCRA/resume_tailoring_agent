name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # WeasyPrint (PDF export) needs Pango/cairo/gdk-pixbuf system libraries —
      # see the README's Installation section. Without these, just importing
      # resume_agent.tools.pdf_exporter (pulled in by most of the test suite)
      # fails before any test runs.
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 \
            libffi-dev shared-mime-info

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: ".python-version"

      # --locked fails the build if pyproject.toml and uv.lock have drifted,
      # instead of silently re-resolving with whatever's newest.
      - name: Install dependencies
        run: uv sync --locked

      # No ANTHROPIC_API_KEY secret needed: tests/conftest.py sets a placeholder
      # for the mocked unit/integration suite, and tests/evals/ (the one suite
      # that hits the real API) is excluded by default via the `eval` marker in
      # pyproject.toml's pytest addopts.
      - name: Run tests
        run: uv run pytest
