[project]
name = "resume-tailoring-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "markdown>=3.10.2",
    "mypy>=2.2.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-slugify>=8.0.4",
    "rich>=15.0.0",
    "typer>=0.26.8",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.21",
]

[project.scripts]
resume-agent = "resume_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--cov=src/resume_agent --cov-report=term-missing -m 'not eval'"
markers = [
    "eval: hits the real Anthropic API against hand-built fixtures to check critique-persona prompt quality across one or more models. Costs money and is not run by default — use `pytest -m eval tests/evals` to run it explicitly.",
]

[tool.ruff]
src        = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
mypy_path = "src"
strict = true
